# Full pipeline build on GitHub (D11): fetch all inputs, compute the example paths, run every test
# on the real data, publish the ODbL name table (D10) as the `name-table` release, and deploy the
# town files for the rotation (D8 option (a)) to GitHub Pages.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - name: Unit tests
        run: uv run pytest -q
      - name: Fetch inputs
        run: |
          SECONDS=0
          uv run python -m downstream.fetch
          echo "fetch took ${SECONDS}s"; du -sh ../data/raw
      - name: Name the river network (per river, all reaches)
        run: uv run python -m downstream.build_names --workers 4
      - name: Compute paths
        run: uv run python -m downstream.paths
      - name: All tests on the real data (includes the 14 example towns)
        run: uv run pytest -q
      - name: Every Europe town + build report (P7)
        run: |
          uv run python -m downstream.paths --all
          head -12 ../data/report/eu/report.md
      - name: Town files for the rotation + check the committed Polling URL
        run: |
          uv run python -m downstream.site
          git diff --exit-code ../recipe/polling_url.liquid
          uv run pytest -q tests/test_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: data/site
      - name: Publish name table (ODbL)
        run: |
          D=../data/names/eu/name_table
          wc -l "$D/name_table.csv"
          gh release view name-table >/dev/null 2>&1 || \
            gh release create name-table --title "Name table (ODbL)" --notes-file "$D/NOTICE.md" --prerelease
          gh release edit name-table --notes-file "$D/NOTICE.md"
          gh release upload name-table "$D/name_table.csv" "$D/name_en.csv" "$D/NOTICE.md" --clobber
          gh release view build-report >/dev/null 2>&1 || \
            gh release create build-report --title "Build report" --notes "Latest build report (report.md, towns.csv). Town chains contain OpenStreetMap names: see the name-table release for the ODbL notice." --prerelease
          gh release upload build-report ../data/report/eu/report.md ../data/report/eu/towns.csv --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
