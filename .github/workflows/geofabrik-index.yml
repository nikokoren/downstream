# Print Geofabrik's region index under a parent (ids, parents, PBF sizes) so region names in
# pipeline/downstream/osm_regions*.txt come from the source, not from memory.
name: geofabrik-index

on:
  workflow_dispatch:
    inputs:
      parent:
        description: "Geofabrik parent region id, e.g. europe or north-america"
        required: true
        default: europe

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Regions under the parent
        env:
          PARENT: ${{ inputs.parent }}
        run: |
          curl -fsSL https://download.geofabrik.de/index-v1-nogeom.json -o index.json
          python3 - <<'PY'
          import json, os, subprocess
          feats = json.load(open("index.json"))["features"]
          props = {f["properties"]["id"]: f["properties"] for f in feats}
          def europe(p):
              while p.get("parent"):
                  if p["parent"] == os.environ["PARENT"]:
                      return True
                  p = props.get(p["parent"], {})
              return False
          rows = [p for p in props.values() if europe(p)]
          for p in sorted(rows, key=lambda p: (p.get("parent"), p["id"])):
              url = p.get("urls", {}).get("pbf", "")
              size = ""
              if url:
                  h = subprocess.run(["curl", "-sfI", url], capture_output=True, text=True).stdout
                  size = next((l.split(":")[1].strip() for l in h.splitlines() if l.lower().startswith("content-length")), "")
              print(f"{p.get('parent')}\t{p['id']}\t{size}\t{url}")
          PY
