# Extract named OSM waterways and lakes for Geofabrik regions (one job and one release per region), D10, D11.
# Runs on GitHub because download.geofabrik.de isn't reachable from the development container.
name: osm-waterways

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Space-separated Geofabrik region paths, e.g. europe/austria europe/germany/hessen"
        required: true
        default: europe/germany/bayern

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.split.outputs.regions }}
    steps:
      - id: split
        env:
          REGIONS: ${{ inputs.regions }}
        run: echo "regions=$(printf '%s\n' $REGIONS | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    env:
      REGION: ${{ matrix.region }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Download region extract
        run: |
          mkdir -p ../data
          base="https://download.geofabrik.de/${REGION}-latest.osm.pbf"
          curl -fsSL --retry 3 -o ../data/region.osm.pbf "$base"
          curl -fsSL --retry 3 -o ../data/region.osm.pbf.md5 "$base.md5"
          echo "$(cut -d' ' -f1 ../data/region.osm.pbf.md5)  ../data/region.osm.pbf" | md5sum -c -
          ls -l ../data/region.osm.pbf
          curl -fsSI "$base" | grep -i '^last-modified' || true
      - name: Extract named waterways
        run: |
          SLUG="${REGION//\//-}"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          SECONDS=0
          uv run python -m downstream.osm_waterways ../data/region.osm.pbf "../data/waterways-$SLUG.fgb" "../data/lakes-$SLUG.fgb"
          echo "extract took ${SECONDS}s"
          ls -l "../data/waterways-$SLUG.fgb" "../data/lakes-$SLUG.fgb"
      - name: Publish release asset (ODbL)
        run: |
          TAG="osm-waterways-$SLUG"
          cat > ../data/NOTICE.md <<NOTICE
          Named waterway lines and named lakes (natural=water + water=lake) extracted from OpenStreetMap (Geofabrik extract ${REGION}, downloaded $(date -u +%Y-%m-%dT%H:%MZ)).
          © OpenStreetMap contributors. Available under the Open Database License (ODbL) 1.0:
          https://opendatacommons.org/licenses/odbl/1-0/ . See https://www.openstreetmap.org/copyright
          Produced by pipeline/downstream/osm_waterways.py in this repository (commit ${GITHUB_SHA}).
          NOTICE
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "OSM waterways: $REGION" --notes-file ../data/NOTICE.md --prerelease
          gh release upload "$TAG" "../data/waterways-$SLUG.fgb" "../data/lakes-$SLUG.fgb" ../data/NOTICE.md --clobber
