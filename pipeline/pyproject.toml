[project]
name = "downstream-pipeline"
version = "0.1.0"
description = "Build-time data preparation for the Downstream TRMNL recipe (PROJECT.md D11)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.2,<1.3",
    "shapely>=2.1,<2.2",
    "pyogrio>=0.13,<0.14",
    "pyproj>=3.8,<3.9",
    "osmium>=4.3,<4.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "python-liquid>=2.3.3",
    "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
